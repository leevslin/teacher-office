<style>

  #panel { width: var(--pw, max(600px, 46vw)); max-width: calc(100vw - 260px); flex: none; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); min-height: 0; }

  #tabs { display: grid; grid-template-columns: repeat(var(--nstaff, 4), minmax(0, 1fr)) 56px 56px 34px; gap: 6px; padding: 10px 10px 8px; border-bottom: 1px solid var(--line); }
  .stab { min-width: 0; border: 1.5px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 6px 6px; cursor: pointer; text-align: left; position: relative; transition: border-color .15s, box-shadow .15s; }
  .stab:hover { border-color: #cfc6b6; }

  .more { border: 0; background: transparent; color: #6b5a8e; cursor: pointer; font-size: 12.5px; padding: 4px 0; }

  .cprog .c { font-weight: 700; text-align: center; border-radius: 7px; padding: 3px 0; }
  .boardActs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  #boardBtn { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 5; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  #modal pre { white-space: pre-wrap; font-family: var(--font); font-size: 13.5px; line-height: 1.7; background: #f8f5ee; padding: 10px 12px; border-radius: 8px; }

  @media (max-width: 980px) {
    #app { flex-direction: column; }
    #stage { flex: none; height: 42vh; }
    #panel { width: auto !important; max-width: none; flex: 1; border-left: 0; border-top: 1px solid var(--line); }
    #split, #bigBtn { display: none; }
    #log { display: none; }
  }
</style>
</head>
<body>
<div id="app">
  <section id="stage">
    <div id="three"></div>
    <div id="hud">
      <div class="title"><h1>教師辦公室</h1><div class="sub" id="clock"></div></div>
      <div id="log"></div>
    </div>
    <div id="help3d">拖曳旋轉・滾輪縮放・點人物叫他</div>
    <div id="nogl" hidden></div>
    <button class="btn ghost sm" id="bigBtn" title="把右邊的對話視窗放大或縮回">⤢ 對話放大</button>
    <button class="btn ghost sm" id="boardBtn" title="打開公佈欄：進度表、各班進度、便條（也可以直接點 3D 裡的黑板）">📋 公佈欄</button>
    <button class="btn" id="openChat" hidden>💬 打開對話</button>
  </section>
  <div id="split" title="拖曳調整對話視窗寬度（點兩下恢復）"></div>
  <aside id="panel">
    <div id="banner"></div>
    <nav id="tabs"></nav>
    <div id="chat">
      <div id="convBar"></div>
      <div id="msgs"></div>
      <div id="ctxWarn" hidden></div>
      <div id="composer">
        <div id="chips"></div>
        <div id="atts"></div>
        <textarea id="input" placeholder="跟員工說要做什麼……（可以把檔案拖進來，或直接貼上截圖）"></textarea>
        <div class="row">
          <button class="btn ghost" id="clip" title="附加檔案（照片、PDF、Word、Excel……）">📎</button>
          <input type="file" id="fileIn" multiple hidden>
          <select id="model" title="這位員工用的模型"></select>
          <label class="hint" id="contWrap" title="打勾：接著這段對話聊（員工記得前面講過的，但每句話都會把前面全部重送一次，比較耗額度）。&#10;不打勾：開一段新對話（員工從檔案找資料，比較省）。"><input type="checkbox" id="cont" style="vertical-align:-2px;accent-color:#8e6bbf"> 接著這段聊</label>
          <span class="hint" id="sendHint">Ctrl + Enter 送出</span>
          <button class="btn danger" id="stop" hidden>停止</button>
          <button class="btn pri" id="send">送出</button>
        </div>
        <div id="modelHint" hidden></div>
      </div>
    </div>
    <div id="files" hidden></div>
    <div id="prog" hidden></div>
  </aside>
</div>
<div id="toast"></div>
<div id="pop"></div>
<div id="modal"><div class="box"><div id="modalBody"></div><div style="text-align:right;margin-top:10px"><button class="btn ghost" id="modalClose">關閉</button></div></div></div>

<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const STATUS_TEXT = { idle: '閒著', working: '工作中', waiting: '等你確認', done: '做完了' };
const CHIPS = {
  beike: ['幫我備五上 3-1 的課，先讀課本 PDF', '整理五上第 3 單元重點給珍奶', '整理六上第 3 單元重點給珍奶', '排期中到期末的各班進度'],
  chuti: ['出五上期末考（第 3～4 單元）', '照 5 點審查意見改六上第 3 單元學習單', '出六上期末考（第 3～4 單元）', '出一題讀地圖的素養題組'],
  shenti: ['審 題庫/ 裡最新的那份', '抽查這份卷子的課本頁碼', '段考卷最後總檢查'],
  paiban: ['把 題庫/ 裡最新的那份排成 Word', '這份考卷壓到 2 頁', '把教案排成 Word'],
  shuxue: ['出四上數學期末考（第 6～10 單元）', '出第 6 單元分數的小考', '照審題意見改數學考卷', '填這份數學考卷的雙向細目表'],
};
const PATH_RE = /((?:題庫|備課|審題紀錄|成品|收件匣|教學進度|教材|範例)\/[^\s，。、；：）)」』`*]+)/g;

let S = null, V = 0, BOARD = null, cur = 'beike', tab = 'chat', office = null, lastRenderKey = '', serverDown = false;
const drafts = {};
let handled = {};
try { cur = localStorage.getItem('office.cur') || 'beike'; handled = JSON.parse(localStorage.getItem('office.handled') || '{}'); } catch (e) {}

function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms); }
function modal(html) { $('#modalBody').innerHTML = html; $('#modal').style.display = 'flex'; }
$('#modalClose').onclick = () => { $('#modal').style.display = 'none'; $('#modal .box').classList.remove('wide', 'xlbox'); };
$('#modal').onclick = e => { if (e.target.id === 'modal') { $('#modal').style.display = 'none'; $('#modal .box').classList.remove('wide', 'xlbox'); } };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#modal').style.display === 'flex') $('#modalClose').click(); });

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  let d = {}; try { d = await r.json(); } catch (e) {}
  if (!r.ok || d.error) throw new Error(d.error || ('HTTP ' + r.status));
  return d;
}
const staffOf = k => (S && S.staff.find(s => s.key === k)) || { key: k, name: k, role: '' };
const boardStatus = k => { const s = BOARD && BOARD.staff && BOARD.staff[k]; return s && s.status || 'idle'; };
function liveStatus(k) { const ch = S && S.channels[k]; return ch && ch.running ? 'working' : boardStatus(k); }

// ---------- 輪詢 ----------
async function poll() {
  try {
    const d = await api('/api/state?v=' + V);
    if (serverDown) { serverDown = false; renderBanner(); }
    if (!d.same) {
      S = d; V = d.v; render();
      const busy = !!(S.channels.beike && S.channels.beike.running);
      if (tab === 'prog' && (busy !== BEIKE_BUSY || (S.plan_mtime && S.plan_mtime !== PLAN_MT))) showProg();
      BEIKE_BUSY = busy; PLAN_MT = S.plan_mtime;
    }
  } catch (e) {
    if (!serverDown) { serverDown = true; renderBanner(); }
  }
  setTimeout(poll, 1200);
}
async function pollBoard() {
  try {
    const t = await (await fetch('/辦公室狀態.js?t=' + Date.now())).text();
    const body = t.slice(t.indexOf('=') + 1).trim().replace(/;\s*$/, '');
    BOARD = JSON.parse(body);
    if (office) office.update(BOARD);
    renderLog(); renderTabs();
  } catch (e) {}
  setTimeout(pollBoard, 3000);
}

// ---------- 畫面 ----------
function renderBanner() {
  const b = [];
  if (location.protocol === 'file:') b.push('<span class="err">請不要直接點開這個檔案。</span>請執行資料夾裡的 <b>開辦公室.bat</b>，它會自動打開正確的網頁。');
  else if (serverDown) b.push('<span class="err">指令台沒有開著。</span>請執行 <b>開辦公室.bat</b>（黑色視窗不要關）。');
  if (S && !S.claude_ok) b.push('<span class="err">這台電腦找不到 Claude Code。</span>請照 <b>開始使用.md</b> 第 1 步安裝並登入，再重開辦公室。');
  if (S && !S.docx_ok) b.push('Word 排版工具還沒裝好（python-docx），重開 開辦公室.bat 會自動安裝。');
  $('#banner').innerHTML = b.join('<br>');
}
function renderLog() {
  const lg = (BOARD && BOARD.log || []).slice(0, 6);
  const name = w => w === 'teacher' ? '老師' : staffOf(w).name;
  $('#log').innerHTML = lg.map(x => `<div><span class="t">${esc((x.time || '').slice(11))}</span><b>${esc(name(x.who))}</b>　${esc(x.text)}</div>`).join('');
}
function renderTabs() {
  if (!S) return;
  $('#tabs').innerHTML = S.staff.map(s => {
    const st = liveStatus(s.key), b = BOARD && BOARD.staff && BOARD.staff[s.key];
    const txt = st === 'working' ? '工作中' : (b && b.task ? b.task.replace(/^(完成|待確認)：/, '') : STATUS_TEXT[st]);
    return `<button class="stab ${tab === 'chat' && cur === s.key ? 'on' : ''}" style="--c:var(--${s.key})" data-k="${s.key}">
      <div class="bar"></div><span class="nm">${esc(s.name)}</span><span class="rl">${esc(s.role)}</span>
      <div class="st"><i class="dot ${st}"></i><span>${esc(txt)}</span></div></button>`;
  }).join('') + `<button class="stab ftab ${tab === 'prog' ? 'on' : ''}" data-k="__prog"><span class="ic">📅</span>進度</button>`
    + `<button class="stab ftab ${tab === 'files' ? 'on' : ''}" data-k="__files"><span class="ic">🗂</span>檔案</button>`
    + `<button class="closeBtn" id="closeChat" title="收起對話視窗，只看 3D 辦公室">✕</button>`;
  $('#tabs').style.setProperty('--nstaff', S.staff.length);
  $('#tabs').querySelectorAll('.stab').forEach(b => b.onclick = () => b.dataset.k === '__files' ? showFiles() : b.dataset.k === '__prog' ? showProg() : choose(b.dataset.k));
  $('#closeChat').onclick = () => setChatOpen(false);
}
function choose(k) {
  if (!S || !S.channels[k]) return;
  drafts[cur] = $('#input').value;
  cur = k; tab = 'chat';
  try { localStorage.setItem('office.cur', k); } catch (e) {}
  $('#input').value = drafts[k] || '';
  $('#chat').hidden = false; $('#files').hidden = true; $('#prog').hidden = true;
  lastRenderKey = ''; render();
  if (office) office.select(k);
}
function render() {
  if (!S) return;
  renderBanner(); renderTabs();
  if (!S.channels[cur]) cur = S.staff[0].key;
  const ch = S.channels[cur], me = staffOf(cur);
  document.documentElement.style.setProperty('--c', `var(--${cur})`);
  // 對話分頁
  $('#convBar').innerHTML = ch.convs.slice().reverse().map(c =>
    `<div class="conv ${c.id === ch.active ? 'on' : ''}" data-id="${c.id}" title="${esc(c.created)}"><span>${esc(c.title)}</span>${c.id === ch.active ? '' : '<button class="x" title="刪除這段對話">✕</button>'}</div>`
  ).join('') + `<button class="newc" id="newConv">＋ 新對話</button>`;
  $('#convBar').querySelectorAll('.conv').forEach(el => {
    el.onclick = async e => {
      if (e.target.classList.contains('x')) {
        const x = e.target;
        if (!x.classList.contains('arm')) { x.classList.add('arm'); x.textContent = '刪除？'; setTimeout(() => { x.classList.remove('arm'); x.textContent = '✕'; }, 3000); return; }
        try { await api('/api/delconv', { staff: cur, id: el.dataset.id }); } catch (err) { toast(err.message); }
        return;
      }
      if (el.dataset.id === ch.active) return;
      try { await api('/api/switch', { staff: cur, id: el.dataset.id }); } catch (err) { toast(err.message); }
    };
  });
  $('#newConv').onclick = async () => { try { await api('/api/new', { staff: cur }); $('#modelHint').hidden = true; } catch (e) { toast(e.message); } };
  // 模型
  const sel = $('#model');
  sel.innerHTML = S.models.map(m => `<option value="${m.id}" ${m.id === ch.model ? 'selected' : ''}>${esc(m.label)}</option>`).join('');
  // 訊息
  const key = cur + ':' + ch.active + ':' + ch.events.length + ':' + ch.running + ':' + JSON.stringify(handled).length;
  if (key !== lastRenderKey) {
    lastRenderKey = key;
    const box = $('#msgs'), atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    box.innerHTML = ch.events.length ? ch.events.map((e, i) => renderEvent(e, i, me, ch.active)).join('') :
      `<div class="empty">這是和 <b>${esc(me.name)}</b>（${esc(me.role)}）的新對話。<br>直接打字交代工作，或點下面的範例。<br><span style="font-size:12px">換一件不相關的工作時，按上面的「＋ 新對話」比較省額度。</span></div>`;
    if (ch.running) box.insertAdjacentHTML('beforeend', `<div class="busy"><i></i><i></i><i></i>${esc(me.name)}工作中……</div>`);
    if (atBottom || ch.events.length < 3) box.scrollTop = box.scrollHeight;
    bindMsgs();
  }
  $('#send').disabled = ch.running; $('#stop').hidden = !ch.running;
  const cw = $('#contWrap'), cb = $('#cont'), lastTs = ch.events.length ? (ch.events[ch.events.length - 1].ts || 0) : 0;
  cw.hidden = !ch.events.length;
  const autoCont = ch.events.length && (Date.now() / 1000 - lastTs) < 10 * 60 && ch.context < S.long_context;
  cb.checked = contChoice[cur + ':' + ch.active] ?? !!autoCont;
  cw.classList.toggle('on', cb.checked);
  cw.lastChild.textContent = cb.checked ? ' 接著這段聊' : ' 接著這段聊（不勾＝自動開新對話）';
  $('#chips').innerHTML = (CHIPS[cur] || []).map(c => `<button class="chip">${esc(c)}</button>`).join('');
  $('#chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { const t = $('#input'); t.value = t.value.trim() ? t.value + '\n' + b.textContent : b.textContent; t.focus(); });
  const w = $('#ctxWarn');
  if (ch.context > S.long_context) { w.hidden = false; w.textContent = `這段對話已經很長（約 ${Math.round(ch.context / 10000)} 萬 token）。下一句建議不要勾「接著這段聊」，讓辦公室自動開新對話。`; }
  else w.hidden = true;
}
function fmtText(t) {
  let h = esc(t);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  h = h.replace(PATH_RE, m => `<span class="path" data-p="${m}">${m}</span>`);
  h = h.replace(/^【完成】(.*)$/gm, '<span class="tagline ok">✓ $1</span>')
       .replace(/^【待確認】(.*)$/gm, '<span class="tagline wait">？ $1</span>')
       .replace(/^【交接】(.*)$/gm, '<span class="tagline hand">→ 交接 $1</span>');
  return h.replace(/\n/g, '<br>');
}
function renderEvent(e, i, me, convId) {
  switch (e.k) {
    case 'me': return `<div class="m me"><div class="b">${fmtText(e.text)}</div></div>`;
    case 'text': return `<div class="m text"><div class="who">${esc(me.name)}・${esc(e.time)}</div><div class="b">${fmtText(e.text)}</div></div>`;
    case 'tool': return `<div class="m tool">${fmtText(e.text)}</div>`;
    case 'sys': return `<div class="m sys">${fmtText(e.text)}</div>`;
    case 'error': return `<div class="m error">${fmtText(e.text)}</div>`;
    case 'done': return `<div class="m done">做完了・${esc(e.text)}</div>`;
    case 'handoff': {
      const to = staffOf(e.to), hk = cur + ':' + convId + ':' + i, done = handled[hk];
      return `<div class="m handoff" style="--hc:var(--${e.to})"><div class="hd">${esc(me.name)} 想交接給 <b>${esc(to.name)}</b>（${esc(to.role)}）</div>${fmtText(e.text)}
        <div class="acts">${done ? `<span style="font-size:12px;color:var(--muted)">${done === 'sent' ? '✓ 已交給' + esc(to.name) : '已略過'}</span>` :
        `<button class="btn pri sm" style="background:var(--${e.to})" data-hand="${hk}" data-to="${e.to}" data-i="${i}">交給${esc(to.name)}</button><button class="btn ghost sm" data-skip="${hk}">先不要</button>`}</div></div>`;
    }
  }
  return '';
}
function bindMsgs() {
  const box = $('#msgs');
  box.querySelectorAll('[data-hand]').forEach(b => b.onclick = async () => {
    const ch = S.channels[cur], ev = ch.events[+b.dataset.i], me = staffOf(cur), to = b.dataset.to;
    const text = `${me.name}（${me.role}）交接：${ev.text}`;
    try {
      await api('/api/send', { staff: to, text, fresh: true, title: `${me.name}交接` });
      handled[b.dataset.hand] = 'sent'; saveHandled(); toast(`已交給${staffOf(to).name}`); choose(to);
    } catch (e) { toast(e.message); }
  });
  box.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => { handled[b.dataset.skip] = 'skip'; saveHandled(); lastRenderKey = ''; render(); });
  box.querySelectorAll('.path').forEach(p => p.onclick = e => showPop(e, p.dataset.p));
}
function saveHandled() { try { localStorage.setItem('office.handled', JSON.stringify(handled)); } catch (e) {} }

// ---------- 檔案動作 ----------
function showPop(e, path) {
  const pop = $('#pop'); e.stopPropagation();
  const isMd = path.endsWith('.md');
  pop.innerHTML = `<div class="pt">${esc(path)}</div>
    <button class="btn ghost sm" data-a="open">打開</button>
    <button class="btn ghost sm" data-a="reveal">在資料夾裡顯示</button>
    ${isMd ? '<button class="btn ghost sm" data-a="docx">轉成 Word</button>' : ''}
    <button class="btn ghost sm" data-a="insert">貼到指令框</button>`;
  pop.style.display = 'flex';
  const r = pop.getBoundingClientRect();
  pop.style.left = Math.min(e.clientX, innerWidth - r.width - 10) + 'px';
  pop.style.top = Math.min(e.clientY + 8, innerHeight - r.height - 10) + 'px';
  pop.querySelectorAll('button').forEach(b => b.onclick = () => { pop.style.display = 'none'; fileAction(b.dataset.a, path); });
}
document.addEventListener('click', e => { if (!e.target.closest('#pop')) $('#pop').style.display = 'none'; });
async function fileAction(a, path) {
  try {
    if (a === 'open' || a === 'reveal') { await api('/api/' + a, { path }); toast(a === 'open' ? '已打開' : '已在檔案總管顯示'); }
    else if (a === 'docx' || a === 'pdf') {
      toast(a === 'pdf' ? '轉成 PDF 中……' : '轉成 Word 和 PDF 中……', 40000);
      const d = await api('/api/' + a, { path });
      $('#toast').classList.remove('show');
      modal(`<h3 style="margin:0 0 8px">${d.ok ? '轉好了' : '轉檔有問題'}</h3><pre>${fmtText(d.output || '')}</pre>`);
      $('#modalBody').querySelectorAll('.path').forEach(p => p.onclick = e => showPop(e, p.dataset.p));
      if (tab === 'files') showFiles();
    } else if (a === 'insert') {
      if (tab !== 'chat') choose(cur);
      const t = $('#input'); t.value = (t.value ? t.value.trimEnd() + ' ' : '') + path; t.focus();
    }
  } catch (e) { toast(e.message); }
}
async function showFiles() {
  tab = 'files'; renderTabs();
  $('#chat').hidden = true; $('#prog').hidden = true; const f = $('#files'); f.hidden = false;
  if (office) office.select(null);
  let d; try { d = await api('/api/files'); } catch (e) { f.innerHTML = `<p class="fnote">${esc(e.message)}</p>`; return; }
  const ago = t => { const s = (Date.now() / 1000 - t); return s < 3600 ? Math.max(1, Math.round(s / 60)) + ' 分鐘前' : s < 86400 ? Math.round(s / 3600) + ' 小時前' : new Date(t * 1000).toLocaleDateString('zh-TW'); };
  f.innerHTML = `<p class="fnote">滑過檔案會出現按鈕。「轉 Word＋PDF」會把題目原稿排成可以印的考卷和答案卷（Word 檔和 PDF 各一份），放到 成品/。Word 檔旁邊的「轉 PDF」可以把你自己改過的 Word 檔重新轉成 PDF。<br>要給員工看的東西，丟進 <b>收件匣</b> 資料夾就好。</p>` +
    d.groups.map(g => `<h3>${esc(g.name)} <small>${g.files.length ? g.files.length + ' 個檔' : '空的'}</small>
      <button class="btn ghost sm" style="margin-left:auto" data-reveal="${esc(g.name)}">打開資料夾</button></h3>` +
      g.files.map(x => `<div class="frow"><span class="fn" title="${esc(x.path)}">${esc(x.path.split('/').slice(1).join('/'))}</span><span class="ft">${ago(x.mtime)}</span>
        <span class="fa"><button class="btn ghost sm" data-a="open" data-p="${esc(x.path)}">打開</button>
        ${x.path.endsWith('.md') && !x.path.startsWith('收件匣') ? `<button class="btn ghost sm" data-a="docx" data-p="${esc(x.path)}">轉 Word＋PDF</button>` : ''}
        ${x.path.toLowerCase().endsWith('.docx') ? `<button class="btn ghost sm" data-a="pdf" data-p="${esc(x.path)}">轉 PDF</button>` : ''}
        <button class="btn ghost sm" data-a="insert" data-p="${esc(x.path)}">給${esc(staffOf(cur).name)}</button></span></div>`).join('')).join('');
  f.querySelectorAll('[data-a]').forEach(b => b.onclick = () => fileAction(b.dataset.a, b.dataset.p));
  f.querySelectorAll('[data-reveal]').forEach(b => b.onclick = async () => {
    const g = d.groups.find(x => x.name === b.dataset.reveal);
    const p = g && g.files[0] ? g.files[0].path : null;
    if (!p) return toast('這個資料夾還是空的');
    fileAction('reveal', p);
  });
}

// ---------- 送出 ----------

  } else {

    h += `<div style="padding:8px 10px;background:#fff;font-weight:700">${esc(c.title || XTAB)}</div>
      <table class="xl"><tr><th>週次</th><th>日期</th><th>星期</th><th>節次</th><th>堂數</th><th>課程內容（課本頁次）</th><th>課堂習作</th><th>回家作業（作業簿）</th><th style="min-width:76px">完成</th><th style="min-width:160px">備註</th></tr>` +
      c.sessions.map(x => {
        const late = !x.done && x.date && x.date < today, cls2 = [kind(x.content), x.done ? 'done' : late ? 'late' : '', x.date === today ? 'today' : ''].join(' ');
        return `<tr class="${cls2}" ${x.date === today ? 'id="xToday"' : ''}><td class="c">${esc(x.week || '')}</td><td class="c">${md(x.date)}</td><td class="c">${esc(x.wd || '')}</td><td class="c">${esc(x.period || '')}</td>
          <td class="c">${x.n}</td><td class="ct">${esc(x.content)}</td><td>${esc(x.workbook || '')}</td><td>${esc(x.homework || '')}</td>
          <td class="c st">${x.done ? '✓ ' + md(x.doneDate) : late ? '未上' : ''}</td><td>${esc(x.note || '')}</td></tr>`;
      }).join('') + (c.footer || []).map(([a, b]) => `<tr class="foot"><td class="c">${esc(a)}</td><td colspan="9">${esc(b)}</td></tr>`).join('') + `</table>`;
  }
  h += `</div>`;
  modal(h); const bx = $('#modal .box'); bx.classList.remove('wide'); bx.classList.add('xlbox');
  $('#modalBody').querySelectorAll('[data-x]').forEach(b => b.onclick = e => { e.preventDefault(); showPlanTable(b.dataset.x); });
  $('#xXls').onclick = async () => { try { const r2 = await api('/api/plan/export', {}); if (!r2.ok) return toast(r2.output); fileAction('open', r2.path); } catch (e) { toast(e.message); } };
  $('#xPrint').onclick = () => {
    const w = window.open('', '_blank'); if (!w) return toast('瀏覽器擋住了彈出視窗');
    w.document.write(`<html><head><meta charset="utf-8"><title>${esc(XTAB)} 進度表</title><style>${[...document.querySelectorAll('style')].map(x => x.textContent).join('')} body{background:#fff;padding:10px} .xwrap{max-height:none;overflow:visible}</style></head><body>${$('#xwrap').outerHTML}</body></html>`);
    w.document.close(); setTimeout(() => w.print(), 300);
  };
  const t = document.getElementById('xToday'); if (t) t.scrollIntoView({ block: 'center' });
}
async function showProgFree() {
  const box = $('#prog');
  let d; try { d = await api('/api/progress'); } catch (e) { box.innerHTML = `<p class="fnote">${esc(e.message)}</p>`; return; }
  const today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const md = s => s ? s.slice(5).replace('-', '/') : '';
  let html = `<div class="ptop"><b style="font-size:16px">今天上到哪？</b><input type="date" id="pDate" value="${today}"><span id="pWd" class="fnote"></span></div>
    <p class="fnote" style="margin:6px 0 0">只填今天有上的班就好，空白的不會存。「上到哪」可以寫課次和頁數，例如「3-1 P58–61」。</p>
    <datalist id="dl五">${[...LESSONS['五'], ...EXTRA].map(x => `<option value="${x}">`).join('')}</datalist>
    <datalist id="dl六">${[...LESSONS['六'], ...EXTRA].map(x => `<option value="${x}">`).join('')}</datalist>`;
  Object.entries(d.classes).forEach(([grade, list]) => {
    const g = grade.includes('六') ? '六' : '五';
    html += `<h3>${esc(grade)}</h3>` + list.map(cl => {
      const L = d.latest[cl];
      return `<div class="prow"><span class="cl">${esc(cl)}</span>
        <input data-cl="${esc(cl)}" data-f="text" list="dl${g}" placeholder="上到哪">
        <input data-cl="${esc(cl)}" data-f="note" placeholder="備註（例如：作業沒交完、少一節）">
        <span></span><div class="last">${L ? `上次 ${md(L.date)}：${esc(L.text || '')}${L.note ? '（' + esc(L.note) + '）' : ''}` : '還沒有回報過'}</div></div>`;
    }).join('');
  });
  html += `<div class="pacts"><button class="btn pri" id="pSave" style="background:#8e6bbf">儲存</button>
    <button class="btn ghost" id="pAsk">儲存並請芋圓對照進度表</button></div>`;
  const hist = d.history.slice().reverse(), byDate = {};
  hist.forEach(h => { (byDate[h.date] = byDate[h.date] || []).push(h); });
  const days = Object.keys(byDate).slice(0, 10);
  if (days.length) html += `<h3>最近的回報</h3>` + days.map(dt => `<div class="hist"><b>${md(dt)}</b>　${byDate[dt].map(h => `${esc(h.cls)} ${esc(h.text)}${h.note ? '（' + esc(h.note) + '）' : ''}`).join('、')}</div>`).join('');
  html += `<p class="fnote" style="margin-top:14px">紀錄存在 教學進度/每日回報.md，芋圓排進度時會讀。黑板旁的「任教班級」海報會顯示每班最新進度。</p>`;
  box.innerHTML = html;
  const wd = () => { const v = $('#pDate').value; $('#pWd').textContent = v ? '星期' + '日一二三四五六'[new Date(v + 'T00:00').getDay()] : ''; };
  wd(); $('#pDate').onchange = wd;
  const inputs = [...box.querySelectorAll('.prow input')];
  inputs.forEach((inp, i) => inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); (inputs[i + 1] || $('#pSave')).focus(); } }));
  const collect = () => {
    const m = {};
    inputs.forEach(inp => { const c = inp.dataset.cl; (m[c] = m[c] || { cls: c, text: '', note: '' })[inp.dataset.f] = inp.value.trim(); });
    return Object.values(m).filter(e => e.text || e.note);
  };
  const save = async () => {
    const entries = collect();
    if (!entries.length) { toast('還沒有填任何一班'); return null; }
    const r = await api('/api/progress', { date: $('#pDate').value, entries });
    toast(`已存 ${r.saved} 班的進度`); return entries;
  };
  $('#pSave').onclick = async () => { try { if (await save()) showProgFree(); } catch (e) { toast(e.message); } };
  $('#pAsk').onclick = async () => {
    try {
      const entries = await save(); if (!entries) return;
      const date = $('#pDate').value;
      const text = `今天（${date}）各班進度回報：\n` + entries.map(e => `- ${e.cls}：${e.text}${e.note ? '（' + e.note + '）' : ''}`).join('\n') +
        `\n\n請對照 教學進度/進度表.md（還有 教學進度/每日回報.md 之前的紀錄），告訴我哪幾班落後或超前、落後幾節，接下來怎麼調整才來得及在期末考（1/7–1/8）前上完。有需要就更新進度表。`;
      await api('/api/send', { staff: 'beike', text, fresh: true, title: PDATE ? PDATE.slice(5).replace('-', '/') + ' 進度' : '' });
      toast('已交給芋圓'); choose('beike');
    } catch (e) { toast(e.message); }
  };
}
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); send(); } });
$('#stop').onclick = async () => { try { await api('/api/stop', { staff: cur }); toast('已叫他停下來'); } catch (e) { toast(e.message); } };
$('#model').onchange = async e => {
  try {
    await api('/api/model', { staff: cur, model: e.target.value });
    const ch = S.channels[cur];
    if (ch.events.length) { const h = $('#modelHint'); h.hidden = false; h.innerHTML = '換了模型，這段對話要整段重新讀一次，比較耗額度。如果是要開始新工作，建議先按「＋ 新對話」。'; }
  } catch (err) { toast(err.message); }
};

function tick() {
  const d = new Date();
  $('#clock').textContent = `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}（${'日一二三四五六'[d.getDay()]}）${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}
tick(); setInterval(tick, 10000);

// ---------- 對話視窗寬度：拖曳分隔線、放大按鈕 ----------
const panel = $('#panel'), split = $('#split');
function setPW(px) {
  if (px == null) { panel.style.removeProperty('width'); try { localStorage.removeItem('office.pw'); } catch (e) {} }
  else { px = Math.max(380, Math.min(px, innerWidth - 260)); panel.style.width = px + 'px'; try { localStorage.setItem('office.pw', px); } catch (e) {} }
  $('#bigBtn').textContent = panel.getBoundingClientRect().width > innerWidth * 0.62 ? '⤡ 對話縮回' : '⤢ 對話放大';
}
try { const pw = +localStorage.getItem('office.pw'); if (pw) setPW(pw); else setPW(null); } catch (e) { setPW(null); }
split.addEventListener('pointerdown', e => {
  e.preventDefault(); split.setPointerCapture(e.pointerId); split.classList.add('drag'); document.body.classList.add('dragging');
  const move = ev => setPW(innerWidth - ev.clientX);
  const up = () => { split.removeEventListener('pointermove', move); split.removeEventListener('pointerup', up); split.classList.remove('drag'); document.body.classList.remove('dragging'); };
  split.addEventListener('pointermove', move); split.addEventListener('pointerup', up);
});
split.addEventListener('dblclick', () => setPW(null));
$('#bigBtn').onclick = () => setPW(panel.getBoundingClientRect().width > innerWidth * 0.62 ? null : Math.round(innerWidth * 0.75));
renderBanner(); poll(); pollBoard();
window.__officeReady = o => { office = o; if (BOARD) o.update(BOARD); if (tab === 'chat') o.select(cur); };
window.__officePick = k => {
  if (k === '__board' || k === '__classes') return showBoard();
  if (document.body.classList.contains('chatClosed')) setChatOpen(true); choose(k);
};
// ---------- 公佈欄（點黑板或「📋 公佈欄」打開） ----------
function showBoard() {
  const b = (BOARD && BOARD.board) || {}, rows = Array.isArray(b.progress) ? b.progress : [];
  const cls = v => /完成|已排版|已審|考完/.test(v || '') ? 'ok' : /中|待/.test(v || '') ? 'mid' : '';
  const nc = ['#fff27a', '#ffc6d9', '#bfe8ff', '#c8f2b8', '#ffd9a8'];
  const classes = b.classes || { '五年級': ['508', '509', '511'], '六年級': ['602', '603', '604', '605'] }, cp = b.classProgress || {};
  const d = new Date();
  let h = `<div class="chalk"><h2>現在進度：${esc(b.current || '—')}</h2>
    <div class="d">${d.getMonth() + 1} 月 ${d.getDate()} 日　星期${'日一二三四五六'[d.getDay()]}${BOARD && BOARD.updated ? '　（更新：' + esc(BOARD.updated.slice(5)) + '）' : ''}</div>
    <table><tr><th>單元</th><th>備課</th><th>學習單</th><th>考卷</th></tr>` +
    (rows.length ? rows.map(r => `<tr><td>${esc(r.unit)}</td>${['備課', '學習單', '考卷'].map(k => `<td class="${cls(r[k])}">${esc(r[k] || '·')}</td>`).join('')}</tr>`).join('')
      : `<tr><td colspan="4" style="opacity:.6">還沒有進度</td></tr>`) + `</table></div>`;
  h += `<h3 style="margin:16px 0 4px">各班進度</h3><div class="cprog">` + Object.entries(classes).flatMap(([g, list]) => list.map(c =>
    `<span class="c" style="background:${g.includes('六') ? '#c8e6c9' : '#ffe0b2'}">${esc(c)}</span><span style="color:${cp[c] ? 'inherit' : '#aaa'}">${esc(cp[c] || '還沒回報')}</span>`)).join('') + `</div>`;
  const notes = Array.isArray(b.notes) ? b.notes : [];
  if (notes.length) h += `<h3 style="margin:16px 0 4px">便條</h3><div class="notes">` + notes.map((n, i) =>
    `<div class="note" style="background:${nc[i % nc.length]};transform:rotate(${((i * 37) % 7 - 3) * 0.6}deg)">${esc(n)}</div>`).join('') + `</div>`;
  h += `<div class="boardActs">
    <button class="btn ghost sm" id="bTable">📊 看完整進度表</button>
    <button class="btn ghost sm" data-open="教學進度/每日回報.md">打開每日回報紀錄</button>
    <button class="btn ghost sm" id="bProg">📅 回報今天進度</button>
    <button class="btn ghost sm" id="bAsk">請芋圓更新公佈欄</button></div>
    <p class="fnote" style="margin-top:8px">想改黑板內容（加便條、改現在進度），跟任何一位員工說就好，例如「便條加一張：11/20 段考」。</p>`;
  modal(h); $('#modal .box').classList.add('wide');
  $('#modalBody').querySelectorAll('[data-open]').forEach(x => x.onclick = () => fileAction('open', x.dataset.open));
  $('#bTable').onclick = () => showPlanTable();
  $('#bProg').onclick = () => { $('#modalClose').click(); if (document.body.classList.contains('chatClosed')) setChatOpen(true); showProg(); };
  $('#bAsk').onclick = () => { $('#modalClose').click(); if (document.body.classList.contains('chatClosed')) setChatOpen(true); choose('beike');
    $('#input').value = '請對照 教學進度/每日回報.md 和各單元的檔案，更新公佈欄（辦公室狀態.js 的 board.progress、board.current、board.notes），讓它符合現在的實際進度。'; $('#input').focus(); };
}
$('#boardBtn').onclick = showBoard;
function setChatOpen(open) {
  document.body.classList.toggle('chatClosed', !open);
  $('#openChat').hidden = open;
  try { localStorage.setItem('office.chatClosed', open ? '' : '1'); } catch (e) {}
}
$('#openChat').onclick = () => setChatOpen(true);
try { if (localStorage.getItem('office.chatClosed')) setChatOpen(false); } catch (e) {}
</script>

try {
  const { createOffice } = await import('./office3d.js');

}
